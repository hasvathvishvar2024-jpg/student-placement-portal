
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-placement
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-placement
  template:
    metadata:
      labels:
        app: student-placement
    spec:
      containers:
        - name: student-placement
          image: YOUR_DOCKERHUB_USERNAME/student-placement:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: student-placement-service
spec:
  type: NodePort
  selector:
    app: student-placement
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
